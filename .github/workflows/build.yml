name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI_DERIVED_DATA: .build/CI-DerivedData
      CI_SOURCE_PACKAGES: .build/CI-DerivedData/SourcePackages
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve package dependencies
        run: >-
          xcodebuild
          -resolvePackageDependencies
          -project Pearcleaner.xcodeproj
          -scheme "Pearcleaner Debug"
          -clonedSourcePackagesDirPath "$CI_SOURCE_PACKAGES"

      - name: Test ProjectScannerCore
        run: >-
          xcodebuild -quiet
          -project Pearcleaner.xcodeproj
          -scheme ProjectScannerCore
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$CI_DERIVED_DATA"
          -clonedSourcePackagesDirPath "$CI_SOURCE_PACKAGES"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Verify secret detector corpus gates
        env:
          SECRET_DETECTOR_CORPUS_DERIVED_DATA: "$CI_DERIVED_DATA"
          SECRET_DETECTOR_CORPUS_SOURCE_PACKAGES: "$CI_SOURCE_PACKAGES"
        run: ./script/test_secret_detector_corpus.sh

      - name: Run Git feasibility harness (signed)
        run: |
          if /usr/bin/security find-identity -v -p codesigning 2>/dev/null \
            | /usr/bin/grep -Fq "Developer ID Application"; then
            ./script/git_evidence_feasibility_run.sh
          else
            echo "Deferred: CI runner has no Developer ID signing identity."
            echo "Checked-in git-feasibility manifests remain the tuple gate until a notarized local matrix run passes."
          fi

      - name: Verify Git evidence sandbox checks
        env:
          GIT_FEASIBILITY_SANDBOX_GATE: deferred
        run: ./script/git_evidence_sandbox_checks.sh

      - name: Test git evidence boundary checks
        run: ./script/test_git_evidence_boundaries.sh

      - name: Test ProjectScannerCore with Thread Sanitizer
        run: >-
          xcodebuild -quiet
          -project Pearcleaner.xcodeproj
          -scheme ProjectScannerCore
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath .build/ScannerTSANDerivedData
          -clonedSourcePackagesDirPath "$CI_SOURCE_PACKAGES"
          -disableAutomaticPackageResolution
          -enableThreadSanitizer YES
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Test scanner persistence process boundaries
        env:
          PROJECT_SCANNER_SOURCE_PACKAGES: ${{ env.CI_SOURCE_PACKAGES }}
        run: ./script/test_project_scanner_persistence_boundaries.sh

      - name: Test scanner mount boundary
        env:
          PROJECT_SCANNER_SOURCE_PACKAGES: ${{ env.CI_SOURCE_PACKAGES }}
        run: ./script/test_project_scanner_mount_boundary.sh

      - name: Verify scanner API and dependency boundaries
        run: >-
          ./script/project_scanner_boundary_checks.sh
          "$CI_DERIVED_DATA/Build/Products/Debug"

      - name: Test scanner boundary checks
        run: ./script/test_project_scanner_boundary_checks.sh

      - name: Build Debug
        run: >-
          xcodebuild -quiet
          -project Pearcleaner.xcodeproj
          -scheme "Pearcleaner Debug"
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$CI_DERIVED_DATA"
          -clonedSourcePackagesDirPath "$CI_SOURCE_PACKAGES"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test
        run: >-
          xcodebuild -quiet
          -project Pearcleaner.xcodeproj
          -scheme "Pearcleaner Debug"
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$CI_DERIVED_DATA"
          -clonedSourcePackagesDirPath "$CI_SOURCE_PACKAGES"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Security regression checks
        run: ./script/security_regression_checks.sh "$CI_DERIVED_DATA/Build/Products/Debug/Pearcleaner.app"

      - name: Analyze Debug
        run: >-
          xcodebuild -quiet
          -project Pearcleaner.xcodeproj
          -scheme "Pearcleaner Debug"
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$CI_DERIVED_DATA"
          -clonedSourcePackagesDirPath "$CI_SOURCE_PACKAGES"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          analyze

      - name: Build Release (arm64)
        run: >-
          xcodebuild -quiet
          -project Pearcleaner.xcodeproj
          -scheme "Pearcleaner Release"
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$CI_DERIVED_DATA"
          -clonedSourcePackagesDirPath "$CI_SOURCE_PACKAGES"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=NO
          ARCHS=arm64
          build

      - name: Build Release (x86_64)
        run: >-
          xcodebuild -quiet
          -project Pearcleaner.xcodeproj
          -scheme "Pearcleaner Release"
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$CI_DERIVED_DATA"
          -clonedSourcePackagesDirPath "$CI_SOURCE_PACKAGES"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=NO
          ARCHS=x86_64
          build
